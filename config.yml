# JARVIS Vision Tools - 보안 설정
# scan_mode: "restricted" (기본) 또는 "full" (전체 허용)

scan_mode: restricted

# ui_scan 허용 앱 목록 (restricted 모드에서만 적용)
allowed_apps:
  - Finder
  - Safari
  - Chrome
  - Terminal
  - Xcode
  - System Preferences
  - OpusMessenger
  - Telegram
  - Discord

# ocr_vision 허용 경로 (restricted 모드에서만 적용)
allowed_paths:
  - /tmp/
  - /Users/gray/.openclaw/media/
  - /Users/gray/Desktop/
  - /Users/gray/Downloads/
  - /Users/gray/screenshots/

# 금지된 경로 (모든 모드에서 절대 스캔 불가)
denied_paths:
  - /Users/gray/.ssh/
  - /Users/gray/.gnupg/
  - /Users/gray/.passwords/
  - /Users/gray/Private/

# 전체 화면 스캔 허용 (screencapture)
# full_screen: true면 screencapture로 전체 화면 캡처 가능
# full_screen: false면 스크린샷 파일만 스캔 가능
full_screen: false